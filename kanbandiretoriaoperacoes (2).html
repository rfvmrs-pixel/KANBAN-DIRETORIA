<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KANBAN Diretoria de Operações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1efe9;
    --surface: #ffffff;
    --surface-raised: #fbfaf6;
    --surface-sunk: #e9e5db;
    --border: #ded7c8;
    --border-strong: #c9c0ac;
    --text: #211c14;
    --text-muted: #756a58;
    --text-faint: #a49a86;
    --accent: #b8500f;
    --accent-ink: #7a3608;
    --accent-soft: #f3e0cd;
    --focus: #2f6f6b;

    --status-todo: #a63c3c;
    --status-todo-soft: #f6dede;
    --status-doing: #a97a12;
    --status-doing-soft: #f3e6c6;
    --status-done: #2f7a4f;
    --status-done-soft: #dcecdf;

    --shadow-sm: 0 1px 2px rgba(33, 28, 20, 0.08);
    --shadow-md: 0 8px 24px rgba(33, 28, 20, 0.16);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15130f;
      --surface: #1d1a14;
      --surface-raised: #242019;
      --surface-sunk: #110f0b;
      --border: #38321f;
      --border-strong: #4d452c;
      --text: #f2ede1;
      --text-muted: #b3a68c;
      --text-faint: #7d735d;
      --accent: #e2822f;
      --accent-ink: #ffbe80;
      --accent-soft: #3a2612;
      --focus: #5fb3ac;

      --status-todo: #e07070;
      --status-todo-soft: #3a2020;
      --status-doing: #dcab48;
      --status-doing-soft: #3a2f14;
      --status-done: #6ac48c;
      --status-done-soft: #17301f;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15130f;
    --surface: #1d1a14;
    --surface-raised: #242019;
    --surface-sunk: #110f0b;
    --border: #38321f;
    --border-strong: #4d452c;
    --text: #f2ede1;
    --text-muted: #b3a68c;
    --text-faint: #7d735d;
    --accent: #e2822f;
    --accent-ink: #ffbe80;
    --accent-soft: #3a2612;
    --focus: #5fb3ac;

    --status-todo: #e07070;
    --status-todo-soft: #3a2020;
    --status-doing: #dcab48;
    --status-doing-soft: #3a2f14;
    --status-done: #6ac48c;
    --status-done-soft: #17301f;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  svg { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: middle; }

  html, body {
    background: var(--bg);
    color: var(--text);
  }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: 'Manrope', 'Inter', sans-serif; text-wrap: balance; margin: 0; }

  .tabular { font-variant-numeric: tabular-nums; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  a { color: var(--accent-ink); }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app-shell {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 64px;
  }

  /* header */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    border: none;
    background: none;
    padding: 4px 6px 4px 0;
    margin: 0;
    border-radius: 8px;
    text-align: left;
    color: inherit;
  }
  .brand:hover { background: var(--surface-sunk); }
  .brand img {
    height: 46px;
    width: auto;
    display: block;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand img { filter: invert(1) brightness(1.05); }
  }
  :root[data-theme="dark"] .brand img { filter: invert(1) brightness(1.05); }

  .brand-divider {
    width: 1px;
    height: 38px;
    background: var(--border-strong);
    display: block;
    flex: none;
  }
  .brand-title { display: flex; flex-direction: column; }
  .brand-name {
    font-family: 'Manrope', 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--text);
    line-height: 1.15;
  }
  .brand-title .subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 2px;
  }

  .topbar-meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .updated-at {
    font-size: 12px;
    color: var(--text-faint);
  }
  .badge-readonly {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--status-todo-soft);
    color: var(--status-todo);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge-local {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: help;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff9f2;
  }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn-ghost {
    border-color: transparent;
    background: transparent;
  }
  .btn-ghost:hover { background: var(--surface-sunk); border-color: transparent; }
  .btn-danger { color: var(--status-todo); border-color: var(--status-todo-soft); }
  .btn-danger:hover { background: var(--status-todo-soft); border-color: var(--status-todo); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
  .icon { width: 14px; height: 14px; flex: none; }

  /* cover — the contract menu */
  .cover { padding-top: 4px; }

  .cover-hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 4px 2px 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .cover-hero-text .eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    color: var(--accent-ink);
  }
  .cover-hero-text h2 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin: 6px 0 4px;
  }
  .cover-hero-text p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-muted);
    max-width: 46ch;
  }
  .cover-hero-stats {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .hero-stat { display: flex; flex-direction: column; gap: 1px; }
  .hero-stat .hs-value {
    font-family: 'Manrope', sans-serif;
    font-size: 25px;
    font-weight: 800;
    line-height: 1;
  }
  .hero-stat .hs-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .hero-ring { width: 74px; height: 74px; }
  .hero-ring .ring { width: 100%; height: 100%; }

  .contract-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .contract-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 4px solid var(--card-color, var(--border-strong));
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    color: inherit;
  }
  .contract-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .contract-plate {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 62px;
    padding: 9px 12px;
  }
  .contract-plate img,
  .contract-plate svg {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .contract-plate.sm { height: 40px; width: 116px; padding: 5px 8px; flex: none; }
  .mark-fallback { font-weight: 800; color: #17181A; font-size: 18px; }

  .contract-id { display: flex; flex-direction: column; gap: 1px; }
  .contract-name {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.15;
  }
  .contract-client {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .contract-counts { display: flex; gap: 12px; }
  .contract-counts .cc {
    display: flex;
    flex-direction: column;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-faint);
    line-height: 1.25;
  }
  .contract-counts .cc b {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0;
  }
  .contract-counts .todo b { color: var(--status-todo); }
  .contract-counts .doing b { color: var(--status-doing); }
  .contract-counts .done b { color: var(--status-done); }

  .contract-bar {
    display: block;
    height: 5px;
    border-radius: 999px;
    background: var(--surface-sunk);
    overflow: hidden;
  }
  .contract-bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--status-done);
  }
  .contract-foot {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .all-contracts {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-top: 14px;
    padding: 14px 16px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    color: var(--text-muted);
    text-align: left;
  }
  .all-contracts:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }
  .all-contracts svg { width: 20px; height: 20px; }
  .all-contracts span { display: flex; flex-direction: column; font-size: 11.5px; }
  .all-contracts b { font-size: 14px; color: var(--text); font-family: 'Manrope', sans-serif; }

  /* board header */
  .board-head {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .back-btn { padding-left: 8px; }
  .board-title { display: flex; align-items: center; gap: 12px; }
  .board-title .bt-text { display: flex; flex-direction: column; }
  .board-title .bt-text b {
    font-family: 'Manrope', sans-serif;
    font-size: 19px;
    font-weight: 800;
    line-height: 1.15;
  }
  .board-title .bt-text span { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }

  /* stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .stat-tile .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .stat-tile .value {
    font-family: 'Manrope', sans-serif;
    font-size: 28px;
    font-weight: 800;
    margin-top: 4px;
  }
  .stat-tile.stat-todo .value { color: var(--status-todo); }
  .stat-tile.stat-doing .value { color: var(--status-doing); }
  .stat-tile.stat-done .value { color: var(--status-done); }
  .stat-progress {
    margin-top: 8px;
    height: 6px;
    border-radius: 999px;
    background: var(--surface-sunk);
    overflow: hidden;
  }
  .stat-progress > span {
    display: block;
    height: 100%;
    background: var(--status-done);
    border-radius: 999px;
  }

  .company-progress {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .company-progress .cp-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .cp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px 18px;
  }
  .cp-row { font-size: 12.5px; }
  .cp-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .cp-row .tag { font-size: 10.5px; }
  .cp-row .count { color: var(--text-muted); }
  .cp-bar {
    height: 5px;
    border-radius: 999px;
    background: var(--surface-sunk);
    overflow: hidden;
  }
  .cp-bar > span { display: block; height: 100%; border-radius: 999px; }

  /* filters */
  .filters {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filters .filters-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: 999px;
    padding: 5px 12px 5px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip.active { color: var(--text); border-color: var(--border-strong); background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .chip.all.active { color: var(--accent-ink); border-color: var(--accent); }

  /* board */
  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(300px, 1fr));
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; overflow-x: visible; }
  }

  .column {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    min-height: 120px;
  }
  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 10px;
  }
  .column-head .ch-left { display: flex; align-items: center; gap: 8px; }
  .column-head .dot { width: 10px; height: 10px; border-radius: 3px; }
  .column-head h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .column-head .count {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-sunk);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .column-empty {
    font-size: 12.5px;
    color: var(--text-faint);
    padding: 18px 10px;
    text-align: center;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
  }

  .card-list { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--border-strong));
    border-radius: 8px;
    padding: 10px 10px 8px;
    box-shadow: var(--shadow-sm);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    background: var(--card-color, var(--text-muted));
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .card-actions { display: flex; gap: 2px; flex: none; }
  .icon-btn {
    border: none;
    background: transparent;
    color: var(--text-faint);
    padding: 3px;
    border-radius: 5px;
    display: inline-flex;
  }
  .icon-btn:hover { background: var(--surface-sunk); color: var(--text); }
  .icon-btn.danger:hover { background: var(--status-todo-soft); color: var(--status-todo); }

  .card-text {
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
    cursor: pointer;
  }
  .card-text:hover { text-decoration: underline; text-decoration-color: var(--border-strong); }
  .card-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    gap: 8px;
  }

  .status-pills { display: flex; gap: 4px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: transparent;
  }
  .status-pill[data-checked="true"] {
    background: var(--pill-color);
    border-color: var(--pill-color);
    color: #fff;
  }
  .status-pill svg { width: 12px; height: 12px; }

  .evidence-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-sunk);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 3px 9px;
  }
  .evidence-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .evidence-btn svg { width: 12px; height: 12px; }

  .confirm-row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--status-todo);
    background: var(--status-todo-soft);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .confirm-row .spacer { flex: 1; }

  /* modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
    border: 1px solid var(--border);
  }
  .modal.wide { max-width: 620px; }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }
  .modal-head h3 { font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field select, .field input[type="text"], .field textarea {
    width: 100%;
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    resize: vertical;
  }
  .field textarea { min-height: 64px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .detail-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .detail-status-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .detail-status-opt {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1.5px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--text-muted);
  }
  .detail-status-opt[data-checked="true"] {
    background: var(--opt-soft);
    border-color: var(--opt-color);
    color: var(--opt-color);
  }
  .detail-status-opt input { position: absolute; opacity: 0; pointer-events: none; }
  .detail-status-opt svg { width: 13px; height: 13px; }

  .evidence-section h4 {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .evidence-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }
  .evidence-item {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-sunk);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text-muted);
  }
  .evidence-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .evidence-item .file-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; padding: 6px; text-align: center; word-break: break-word; }
  .evidence-item .file-icon svg { width: 22px; height: 22px; }
  .evidence-remove {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(20,16,10,0.65);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
  }
  .evidence-remove:hover { background: var(--status-todo); }
  .evidence-empty { font-size: 12px; color: var(--text-faint); margin-bottom: 10px; }
  .upload-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    width: 100%;
    justify-content: center;
  }
  .upload-label:hover { border-color: var(--accent); color: var(--accent-ink); }
  .upload-label input { display: none; }

  .toast-wrap {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .toast {
    background: var(--text);
    color: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    animation: toast-in 0.18s ease;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .empty-board { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

      return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function fmtDateShort(iso) {
    try {
      return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
    } catch (e) { return ""; }
  }
  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }
  function findCard(id) {
    for (var i = 0; i < STATE.cards.length; i++) if (STATE.cards[i].id === id) return STATE.cards[i];
    return null;
  }
  function findEvidence(card, evId) {
    return (card.evidence || []).find(function (e) { return e.id === evId; }) || null;
  }

  function toast(msg) {
    var id = ++toastSeq;
    toasts.push({ id: id, msg: msg });
    renderToasts();
    setTimeout(function () {
      toasts = toasts.filter(function (t) { return t.id !== id; });
      renderToasts();
    }, 3800);
  }
  function renderToasts() {
    var el = document.getElementById("toast-wrap");
    if (!el) return;
    el.innerHTML = toasts.map(function (t) { return '<div class="toast">' + escapeHtml(t.msg) + "</div>"; }).join("");
  }

  // ---------- persistence ----------
  //
  // The whole page (markup, styles, script, and the current board data) is
  // one self-contained document, so the same file works in two places:
  //
  //   artifact mode — saving regenerates that document from STATE and
  //     publishes it as a new version; every open view reloads to it, so
  //     the reload IS the save confirmation.
  //   local mode — the downloaded copy opened in a normal browser; saving
  //     writes STATE to that browser's localStorage, and "Baixar HTML"
  //     writes a fresh self-contained copy carrying the current board.
  //
  // Either way there is one source of truth and no separate data file that
  // could drift from what the page shows.

  function readSeedState() {
    var seedEl = document.getElementById("board-data");
    var seed = null;
    try { seed = JSON.parse(seedEl.textContent); } catch (e) { seed = null; }
    if (seed && seed.cards) {
      if (!seed.buildId) seed.buildId = newBuildId();
      return seed;
    }
    return { buildId: newBuildId(), cards: [], updatedAt: new Date().toISOString() };
  }

  function getAppSource() {
    var el = document.getElementById("app-src");
    return el ? el.textContent : "";
  }

  function safeJsonForHtml(obj) {
    // A card's text (or an evidence filename) could contain a closing
    // script-tag sequence or other tag-like text; neutralize "<" so it can
    // never be read as a tag boundary by the HTML parser once embedded in
    // the page. JSON.parse reads the escape back to "<" with no loss of data.
    return JSON.stringify(obj).replace(/</g, "\\u003c");
  }

  function buildFullDocument(state) {
    // Stamp a fresh buildId on the generated document without touching the
    // running page's own STATE: the copy that is written out gets a new
    // identity, so when it is opened it starts from the board embedded in
    // it rather than from whatever localStorage an earlier copy left.
    var out = {};
    for (var k in state) if (Object.prototype.hasOwnProperty.call(state, k)) out[k] = state[k];
    out.buildId = newBuildId();
    return HEAD_STATIC + safeJsonForHtml(out) + MID_STATIC + getAppSource() + TAIL_STATIC;
  }

  async function initCapability() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        artifactAPI = await window.claude.use("artifact");
      }
    } catch (e) { artifactAPI = null; }
    try {
      if (window.claude && typeof window.claude.use === "function") {
        downloadsAPI = await window.claude.use("downloads");
      }
    } catch (e) { downloadsAPI = null; }
    MODE = artifactAPI ? "artifact" : "local";
  }

  function newBuildId() {
    return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function loadState() {
    var seed = readSeedState();
    if (MODE === "artifact") return seed;
    // Local copy: use what this browser saved only when it belongs to THIS
    // file. Every generated document carries its own buildId, so a freshly
    // downloaded copy never matches the localStorage left behind by an older
    // one and correctly starts from the board embedded in it. Matching on
    // identity rather than on timestamps keeps this independent of clock
    // skew between the machine that built the file and the one opening it.
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var stored = JSON.parse(raw);
        if (stored && stored.cards && stored.buildId && stored.buildId === seed.buildId) {
          return stored;
        }
      }
    } catch (e) { /* storage unavailable or unreadable — fall back to seed */ }
    return seed;
  }

  function saveLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(STATE));
      return true;
    } catch (e) {
      toast("Não foi possível salvar neste navegador. Baixe o HTML para guardar as alterações.");
      return false;
    }
  }

  function triggerBlobDownload(data, filename, mime) {
    try {
      var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function downloadBoardHtml() {
    var html = buildFullDocument(STATE);
    if (downloadsAPI) {
      try {
        await downloadsAPI.save({ filename: DOWNLOAD_NAME, data: html });
        toast("HTML salvo.");
        return;
      } catch (err) {
        var code = err && err.code;
        if (code === "declined") return;
        if (code === "rejected_extension" || code === "extension_not_enabled") {
          toast("Baixar HTML não está liberado nesta visualização.");
          return;
        }
        if (code === "too_large") {
          toast("O quadro ficou grande demais para baixar. Remova alguma evidência.");
          return;
        }
        toast("Não foi possível baixar o HTML agora.");
        return;
      }
    }
    if (triggerBlobDownload(html, DOWNLOAD_NAME)) {
      toast("HTML baixado com as ações e evidências atuais.");
    } else {
      toast("Não foi possível baixar o HTML neste navegador.");
    }
  }

  async function downloadEvidence(cardId, evId) {
    var card = findCard(cardId);
    var ev = card && findEvidence(card, evId);
    if (!ev) return;
    var blob;
    try {
      var res = await fetch(ev.dataUrl);
      blob = await res.blob();
    } catch (e) {
      toast("Não foi possível ler este arquivo.");
      return;
    }
    if (!downloadsAPI) {
      if (!triggerBlobDownload(blob, ev.name)) toast("Não foi possível baixar o arquivo.");
      return;
    }
    try {
      await downloadsAPI.save({ filename: ev.name, data: blob });
    } catch (err) {
      var code = err && err.code;
      if (code === "declined") return;
      if (code === "rejected_extension" || code === "extension_not_enabled") {
        toast("Este tipo de arquivo não pode ser baixado por aqui.");
        return;
      }
      if (code === "too_large") {
        toast("Arquivo grande demais para baixar (máx. 16 MB).");
        return;
      }
      toast("Não foi possível baixar o arquivo agora.");
    }
  }

  // In artifact mode a save republishes the page and every view reloads, so
  // where the reader was — which contract they had open, which action's
  // details — has to survive that round trip or each tick would throw them
  // back to the cover.
  function stashUiForReload() {
    try {
      sessionStorage.setItem("kanban-reopen", JSON.stringify({
        view: ui.view,
        filter: ui.filter,
        modal: ui.modal && ui.modal.type === "detail" ? ui.modal : null
      }));
    } catch (e) { /* ignore */ }
  }
  function restoreUiAfterReload() {
    try {
      var raw = sessionStorage.getItem("kanban-reopen");
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved) return;
      if (saved.view === "board" || saved.view === "cover") ui.view = saved.view;
      if (saved.filter && COMPANY_BY_ID[saved.filter]) ui.filter = saved.filter;
      if (saved.modal && saved.modal.cardId && findCard(saved.modal.cardId)) ui.modal = saved.modal;
    } catch (e) { /* ignore */ }
  }

  async function persist() {
    STATE.updatedAt = new Date().toISOString();
    if (MODE === "local") {
      saveLocal();
      return;
    }
    saving = true;
    stashUiForReload();
    try {
      await artifactAPI.publish(buildFullDocument(STATE));
      // on success every view (including this one) reloads to the new version
    } catch (err) {
      saving = false;
      handlePublishError(err);
    }
  }

  function handlePublishError(err) {
    var code = err && err.code;
    if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      READONLY = true;
      toast("Este quadro está em modo somente leitura.");
      render();
      return;
    }
    if (code === "conflict") {
      // another publish landed first; that view's reload already carries the truth
      return;
    }
    if (code === "too_large") {
      toast("Muito grande para salvar. Remova alguma evidência e tente novamente.");
      return;
    }
    if (code === "rate_limited") {
      toast("Muitas alterações seguidas — aguarde um instante e tente de novo.");
      return;
    }
    toast("Não foi possível salvar agora. Tente novamente em instantes.");
  }

  // ---------- mutations ----------

  function addCard(data) {
    var card = {
      id: uid(),
      company: data.company,
      text: data.text.trim(),
      sub: (data.sub || "").trim(),
      status: data.status || "todo",
      evidence: [],
      createdAt: new Date().toISOString()
    };
    STATE.cards.unshift(card);
    ui.modal = null;
    render();
    persist();
  }

  function moveCard(id, status) {
    var c = findCard(id);
    if (!c || c.status === status) return;
    c.status = status;
    render();
    persist();
  }

  function updateCardText(id, text, sub) {
    var c = findCard(id);
    if (!c) return;
    c.text = text.trim() || c.text;
    c.sub = (sub || "").trim();
    render();
    persist();
    toast("Ação atualizada.");
  }

  function deleteCard(id) {
    var idx = STATE.cards.findIndex(function (c) { return c.id === id; });
    if (idx < 0) return;
    STATE.cards.splice(idx, 1);
    ui.modal = null;
    ui.confirmDeleteCard = null;
    render();
    persist();
  }

  async function compressImage(file) {
    try {
      var bitmap = await createImageBitmap(file);
      var maxDim = 1400;
      var w = bitmap.width, h = bitmap.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, cw, ch);
      var blob = await new Promise(function (resolve) {
        canvas.toBlob(function (b) { resolve(b); }, "image/jpeg", 0.78);
      });
      return blob || file;
    } catch (e) {
      return file;
    }
  }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function addEvidenceFiles(cardId, fileList) {
    var card = findCard(cardId);
    if (!card) return;
    var files = Array.prototype.slice.call(fileList);
    var added = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (f.size > 8 * 1024 * 1024) {
        toast('"' + f.name + '" é muito grande (máx. 8 MB).');
        continue;
      }
      var blob = f;
      var isImage = f.type && f.type.indexOf("image/") === 0 && f.type !== "image/gif" && f.type !== "image/svg+xml";
      if (isImage) blob = await compressImage(f);
      var dataUrl;
      try {
        dataUrl = await blobToDataUrl(blob);
      } catch (e) {
        toast('Não foi possível ler "' + f.name + '".');
        continue;
      }
      card.evidence = card.evidence || [];
      card.evidence.push({
        id: uid(),
        name: f.name,
        type: blob.type || f.type || "application/octet-stream",
        size: blob.size,
        dataUrl: dataUrl,
        addedAt: new Date().toISOString()
      });
      added++;
    }
    if (added) {
      render();
      persist();
      toast(added === 1 ? "Evidência anexada." : added + " evidências anexadas.");
    }
  }

  function deleteEvidence(cardId, evId) {
    var card = findCard(cardId);
    if (!card) return;
    var idx = (card.evidence || []).findIndex(function (e) { return e.id === evId; });
    if (idx < 0) return;
    card.evidence.splice(idx, 1);
    if (ui.modal && ui.modal.type === "view-evidence" && ui.modal.evId === evId) {
      ui.modal = { type: "detail", cardId: cardId };
    }
    render();
    persist();
  }

  // ---------- stats ----------

  // Pass a contract id to get that contract's figures; pass null for the
  // whole board. byCompany is always computed across everything, since the
  // cover menu needs every contract's numbers at once.
  function computeStats(filterId) {
    var total = 0;
    var byStatus = { todo: 0, doing: 0, done: 0 };
    var byCompany = {};
    COMPANIES.forEach(function (c) { byCompany[c.id] = { total: 0, done: 0 }; });
    STATE.cards.forEach(function (c) {
      if (!byCompany[c.company]) byCompany[c.company] = { total: 0, done: 0 };
      byCompany[c.company].total++;
      if (c.status === "done") byCompany[c.company].done++;
      if (filterId && c.company !== filterId) return;
      total++;
      if (byStatus[c.status] !== undefined) byStatus[c.status]++;
    });
    var pct = total ? Math.round((byStatus.done / total) * 100) : 0;
    return { total: total, byStatus: byStatus, byCompany: byCompany, pct: pct };
  }

  // ---------- render ----------

  function render() {
    var stats = computeStats(null);
    app.innerHTML =
      renderTopbar(stats) +
      '<div class="app-shell" style="padding-top:0">' +
      (ui.view === "cover" ? renderCover(stats) : renderBoardView(computeStats(ui.filter))) +
      "</div>" +
      renderModal() +
      '<div class="toast-wrap" id="toast-wrap"></div>';
    renderToasts();
    applyPendingFocus();
  }

  function renderTopbar(stats) {
    return (
      '<div class="app-shell" style="padding-bottom:0">' +
      '<div class="topbar">' +
      '<button class="brand" data-action="go-cover" title="Voltar para a capa">' +
      '<img src="' + LOGO_DATA_URI + '" alt="Triunfo Logística" />' +
      '<span class="brand-divider"></span>' +
      '<span class="brand-title"><span class="brand-name">KANBAN</span><span class="subtitle">Diretoria de Operações</span></span>' +
      "</button>" +
      '<div class="topbar-meta">' +
      (READONLY ? '<span class="badge-readonly">Somente leitura</span>' : "") +
      (MODE === "local" ? '<span class="badge-local" title="Esta é a cópia baixada: as alterações ficam salvas neste navegador. Baixe o HTML para levar o quadro para outro computador.">Cópia local</span>' : "") +
      '<span class="updated-at">Atualizado em ' + escapeHtml(fmtDate(STATE.updatedAt)) + "</span>" +
      '<button class="btn" data-action="download-html" title="Baixa este quadro como um arquivo HTML editável, com as ações e evidências atuais">' + ICONS.download + " Baixar HTML</button>" +
      '<button class="btn btn-primary" data-action="open-add"' + (READONLY ? " disabled" : "") + ">" + ICONS.plus + " Nova ação</button>" +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  // ---------- cover ----------

  function renderCover(stats) {
    var cards = COMPANIES.map(function (c) {
      var d = stats.byCompany[c.id] || { total: 0, done: 0 };
      var todo = 0, doing = 0;
      STATE.cards.forEach(function (card) {
        if (card.company !== c.id) return;
        if (card.status === "todo") todo++;
        else if (card.status === "doing") doing++;
      });
      var pct = d.total ? Math.round((d.done / d.total) * 100) : 0;
      return (
        '<button class="contract-card" data-action="open-contract" data-company="' + c.id + '" style="--card-color:' + c.color + '">' +
        '<span class="contract-plate">' + companyMark(c) + "</span>" +
        '<span class="contract-id">' +
        '<span class="contract-name">' + escapeHtml(c.name) + "</span>" +
        '<span class="contract-client">' + escapeHtml(c.client) + "</span>" +
        "</span>" +
        '<span class="contract-counts">' +
        '<span class="cc todo"><b class="tabular">' + todo + "</b>a fazer</span>" +
        '<span class="cc doing"><b class="tabular">' + doing + "</b>andamento</span>" +
        '<span class="cc done"><b class="tabular">' + d.done + "</b>concluído</span>" +
        "</span>" +
        '<span class="contract-bar"><span style="width:' + pct + '%"></span></span>' +
        '<span class="contract-foot"><span class="tabular">' + d.total + (d.total === 1 ? " ação" : " ações") + "</span><span class=\"tabular\">" + pct + "%</span></span>" +
        "</button>"
      );
    }).join("");

    return (
      '<div class="cover">' +
      '<div class="cover-hero">' +
      '<div class="cover-hero-text">' +
      '<div class="eyebrow">Controle de ações · ' + escapeHtml(fmtDateShort(STATE.updatedAt)) + "</div>" +
      "<h2>Contratos</h2>" +
      "<p>Escolha um contrato para abrir o quadro dele, ou veja todas as ações juntas.</p>" +
      "</div>" +
      '<div class="cover-hero-stats">' +
      '<div class="hero-stat"><span class="hs-value tabular">' + stats.total + '</span><span class="hs-label">Ações</span></div>' +
      '<div class="hero-stat"><span class="hs-value tabular" style="color:var(--status-todo)">' + stats.byStatus.todo + '</span><span class="hs-label">A fazer</span></div>' +
      '<div class="hero-stat"><span class="hs-value tabular" style="color:var(--status-doing)">' + stats.byStatus.doing + '</span><span class="hs-label">Andamento</span></div>' +
      '<div class="hero-stat"><span class="hs-value tabular" style="color:var(--status-done)">' + stats.byStatus.done + '</span><span class="hs-label">Concluído</span></div>' +
      '<div class="hero-ring">' + renderRing(stats.pct) + "</div>" +
      "</div>" +
      "</div>" +
      '<div class="contract-grid">' + cards + "</div>" +
      '<button class="all-contracts" data-action="open-all">' + ICONS.grid +
      "<span><b>Todos os contratos</b>Quadro completo com as " + stats.total + " ações</span>" +
      "</button>" +
      "</div>"
    );
  }

  function renderRing(pct) {
    var r = 34, circ = 2 * Math.PI * r;
    var dash = (circ * Math.max(0, Math.min(100, pct))) / 100;
    return (
      '<svg viewBox="0 0 80 80" class="ring" role="img" aria-label="' + pct + '% concluído">' +
      '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="var(--surface-sunk)" stroke-width="8"></circle>' +
      // At 0% the arc is skipped entirely: a zero-length dash with a round
      // cap would still paint a dot, reading as progress that isn't there.
      (dash > 0
        ? '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="var(--status-done)" stroke-width="8" stroke-linecap="round" ' +
          'stroke-dasharray="' + dash.toFixed(1) + " " + (circ - dash).toFixed(1) + '" transform="rotate(-90 40 40)"></circle>'
        : "") +
      '<text x="40" y="45" text-anchor="middle" font-family="Manrope, sans-serif" font-size="19" font-weight="800" fill="var(--text)">' + pct + "%</text>" +
      "</svg>"
    );
  }

  // ---------- board ----------

  function renderBoardView(stats) {
    var c = ui.filter ? COMPANY_BY_ID[ui.filter] : null;
    var head =
      '<div class="board-head">' +
      '<button class="btn btn-ghost back-btn" data-action="go-cover">' + ICONS.back + " Contratos</button>" +
      (c
        ? '<span class="board-title"><span class="contract-plate sm">' + companyMark(c) + "</span>" +
          '<span class="bt-text"><b>' + escapeHtml(c.name) + "</b><span>" + escapeHtml(c.client) + "</span></span></span>"
        : '<span class="board-title"><span class="bt-text"><b>Todos os contratos</b><span>Visão geral</span></span></span>') +
      "</div>";
    return head + renderStats(stats) + renderFilters() + renderBoard();
  }

  function renderStats(stats) {
    return (
      '<div class="stats">' +
      '<div class="stat-tile"><div class="label">Total de ações</div><div class="value tabular">' + stats.total + "</div></div>" +
      '<div class="stat-tile stat-todo"><div class="label">A Fazer</div><div class="value tabular">' + stats.byStatus.todo + "</div></div>" +
      '<div class="stat-tile stat-doing"><div class="label">Em Andamento</div><div class="value tabular">' + stats.byStatus.doing + "</div></div>" +
      '<div class="stat-tile stat-done"><div class="label">Concluído — ' + stats.pct + '%</div><div class="value tabular">' + stats.byStatus.done + "</div>" +
      '<div class="stat-progress"><span style="width:' + stats.pct + '%"></span></div>' +
      "</div>" +
      "</div>"
    );
  }

  function renderFilters() {
    var all = '<button class="chip all' + (ui.filter === null ? " active" : "") + '" data-action="filter-all">Todas</button>';
    var chips = COMPANIES.map(function (c) {
      var active = ui.filter === c.id;
      return (
        '<button class="chip' + (active ? " active" : "") + '" data-action="toggle-filter" data-company="' + c.id + '">' +
        '<span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.label) +
        "</button>"
      );
    }).join("");
    return '<div class="filters"><span class="filters-label">Empresa</span>' + all + chips + "</div>";
  }

  function cardsForStatus(statusId) {
    return STATE.cards.filter(function (c) {
      if (c.status !== statusId) return false;
      if (ui.filter && c.company !== ui.filter) return false;
      return true;
    });
  }

  function renderBoard() {
    var columns = STATUSES.map(function (s) {
      var cards = cardsForStatus(s.id);
      var body = cards.length
        ? '<div class="card-list">' + cards.map(function (c) { return renderCard(c); }).join("") + "</div>"
        : '<div class="column-empty">Nenhuma ação aqui</div>';
      return (
        '<div class="column">' +
        '<div class="column-head"><div class="ch-left"><span class="dot" style="background:' + s.varColor + '"></span><h2>' + s.label + "</h2></div>" +
        '<span class="count tabular">' + cards.length + "</span></div>" +
        body +
        "</div>"
      );
    }).join("");
    if (STATE.cards.length === 0) {
      return '<div class="empty-board">Nenhuma ação cadastrada ainda. Clique em "Nova ação" para começar.</div>';
    }
    return '<div class="board">' + columns + "</div>";
  }

  function renderCard(c) {
    var company = COMPANY_BY_ID[c.company] || { label: c.company, color: "#7b8794" };
    var evCount = (c.evidence || []).length;
    var confirming = ui.confirmDeleteCard === c.id;
    var pills = STATUSES.map(function (s) {
      var checked = c.status === s.id;
      return (
        '<button class="status-pill" data-action="select-status" data-card="' + c.id + '" data-status="' + s.id + '" data-checked="' + checked + '" title="' + s.label + '" style="--pill-color:' + s.varColor + '"' + (READONLY ? " disabled" : "") + ">" +
        (checked ? ICONS.check : "") +
        "</button>"
      );
    }).join("");
    return (
      '<div class="card" style="--card-color:' + company.color + '">' +
      '<div class="card-top">' +
      '<span class="tag" style="background:' + company.color + '">' + escapeHtml(company.label) + "</span>" +
      '<div class="card-actions">' +
      (READONLY ? "" : '<button class="icon-btn" data-action="edit-card" data-card="' + c.id + '" title="Corrigir o texto da ação">' + ICONS.pencil + "</button>") +
      '<button class="icon-btn" data-action="open-detail" data-card="' + c.id + '" title="Abrir detalhes e evidências">' + ICONS.clip + "</button>" +
      (READONLY ? "" : '<button class="icon-btn danger" data-action="ask-delete-card" data-card="' + c.id + '" title="Excluir">' + ICONS.trash + "</button>") +
      "</div>" +
      "</div>" +
      '<div class="card-text" data-action="open-detail" data-card="' + c.id + '">' + escapeHtml(c.text) + "</div>" +
      (c.sub ? '<div class="card-sub">' + escapeHtml(c.sub) + "</div>" : "") +
      (confirming
        ? '<div class="confirm-row">Excluir esta ação?<span class="spacer"></span><button class="btn btn-sm" data-action="cancel-delete-card">Cancelar</button><button class="btn btn-sm btn-danger" data-action="confirm-delete-card" data-card="' + c.id + '">Excluir</button></div>'
        : '<div class="card-bottom">' +
          '<div class="status-pills">' + pills + "</div>" +
          '<button class="evidence-btn" data-action="open-detail" data-card="' + c.id + '">' + ICONS.clip + " " + evCount + "</button>" +
          "</div>") +
      "</div>"
    );
  }

  function renderModal() {
    if (!ui.modal) return "";
    if (ui.modal.type === "add") return renderAddModal();
    if (ui.modal.type === "detail") return renderDetailModal(ui.modal.cardId);
    if (ui.modal.type === "view-evidence") return renderEvidenceViewModal(ui.modal.cardId, ui.modal.evId);
    return "";
  }

  function renderAddModal() {
    var companyOptions = COMPANIES.map(function (c) { return '<option value="' + c.id + '">' + escapeHtml(c.label) + "</option>"; }).join("");
    var statusOptions = STATUSES.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.label) + "</option>"; }).join("");
    return (
      '<div class="overlay" data-action="close-modal-backdrop">' +
      '<div class="modal" data-stop="1">' +
      '<div class="modal-head"><h3>Nova ação</h3><button class="icon-btn" data-action="close-modal">✕</button></div>' +
      '<form id="add-form">' +
      '<div class="field"><label for="f-company">Empresa</label><select id="f-company" required>' + companyOptions + "</select></div>" +
      '<div class="field"><label for="f-text">Ação</label><textarea id="f-text" required placeholder="Descreva a ação..."></textarea></div>' +
      '<div class="field"><label for="f-sub">Detalhe (opcional)</label><input id="f-sub" type="text" placeholder="Observação adicional" /></div>' +
      '<div class="field"><label for="f-status">Situação inicial</label><select id="f-status">' + statusOptions + "</select></div>" +
      '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Adicionar</button></div>' +
      "</form>" +
      "</div>" +
      "</div>"
    );
  }

  function renderDetailModal(cardId) {
    var c = findCard(cardId);
    if (!c) { ui.modal = null; return ""; }
    var company = COMPANY_BY_ID[c.company] || { label: c.company, color: "#7b8794" };
    var statusOpts = STATUSES.map(function (s) {
      var checked = c.status === s.id;
      return (
        '<label class="detail-status-opt" data-checked="' + checked + '" style="--opt-color:' + s.varColor + ";--opt-soft:" + s.varSoft + '">' +
        '<input type="radio" name="detail-status" value="' + s.id + '" data-action="detail-select-status" data-card="' + c.id + '"' + (checked ? " checked" : "") + (READONLY ? " disabled" : "") + " />" +
        (checked ? ICONS.check : "") + " " + s.label +
        "</label>"
      );
    }).join("");

    var evidence = c.evidence || [];
    var evGrid = evidence.length
      ? '<div class="evidence-grid">' + evidence.map(function (e) { return renderEvidenceThumb(c.id, e); }).join("") + "</div>"
      : '<div class="evidence-empty">Nenhuma evidência anexada.</div>';

    return (
      '<div class="overlay" data-action="close-modal-backdrop">' +
      '<div class="modal wide" data-stop="1">' +
      '<div class="modal-head"><h3>Detalhes da ação</h3><button class="icon-btn" data-action="close-modal">✕</button></div>' +
      '<div class="detail-meta"><span class="tag" style="background:' + company.color + '">' + escapeHtml(company.label) + '</span><span class="updated-at">Criada em ' + escapeHtml(fmtDate(c.createdAt)) + "</span></div>" +
      '<div class="field"><label>Ação</label><textarea id="d-text"' + (READONLY ? " disabled" : "") + ">" + escapeHtml(c.text) + "</textarea></div>" +
      '<div class="field"><label>Detalhe</label><input id="d-sub" type="text" value="' + escapeHtml(c.sub || "") + '"' + (READONLY ? " disabled" : "") + " /></div>" +
      (READONLY ? "" : '<div class="modal-actions" style="margin-top:-6px;margin-bottom:14px;justify-content:flex-start"><button class="btn btn-sm" data-action="save-detail-text" data-card="' + c.id + '">Salvar alterações</button></div>') +
      '<div class="field"><label>Situação</label><div class="detail-status-row">' + statusOpts + "</div></div>" +
      '<div class="evidence-section"><h4>Evidências (' + evidence.length + ")</h4>" + evGrid +
      (READONLY ? "" : '<label class="upload-label">' + ICONS.upload + ' Anexar arquivo (imagem ou PDF)<input type="file" multiple accept="image/*,.pdf" data-action="add-evidence" data-card="' + c.id + '" /></label>') +
      "</div>" +
      '<div class="modal-actions">' +
      (READONLY ? "" : '<button class="btn btn-danger" data-action="ask-delete-card" data-card="' + c.id + '">' + ICONS.trash + " Excluir ação</button>") +
      '<button class="btn btn-primary" data-action="close-modal">Fechar</button>' +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  function renderEvidenceThumb(cardId, ev) {
    var isImage = ev.type && ev.type.indexOf("image/") === 0;
    var inner = isImage
      ? '<img src="' + ev.dataUrl + '" alt="' + escapeHtml(ev.name) + '" />'
      : '<div class="file-icon">' + ICONS.file + "<span>" + escapeHtml(ev.name.length > 18 ? ev.name.slice(0, 15) + "…" : ev.name) + "</span></div>";
    return (
      '<button type="button" class="evidence-item" data-action="view-evidence" data-card="' + cardId + '" data-evidence="' + ev.id + '" title="' + escapeHtml(ev.name) + " — " + fmtSize(ev.size) + '">' +
      inner +
      (READONLY ? "" : '<span class="evidence-remove" data-action="delete-evidence" data-card="' + cardId + '" data-evidence="' + ev.id + '" title="Remover">✕</span>') +
      "</button>"
    );
  }

  function renderEvidenceViewModal(cardId, evId) {
    var c = findCard(cardId);
    var ev = c && findEvidence(c, evId);
    if (!c || !ev) { ui.modal = { type: "detail", cardId: cardId }; return renderDetailModal(cardId); }
    var isImage = ev.type && ev.type.indexOf("image/") === 0;
    var isPdf = ev.type === "application/pdf";
    var preview = isImage
      ? '<img src="' + ev.dataUrl + '" alt="' + escapeHtml(ev.name) + '" style="max-width:100%;max-height:60vh;border-radius:8px;display:block;margin:0 auto;" />'
      : isPdf
        ? '<iframe src="' + ev.dataUrl + '" style="width:100%;height:60vh;border:1px solid var(--border);border-radius:8px;background:#fff;"></iframe>'
        : '<div class="evidence-empty">Pré-visualização indisponível para este tipo de arquivo.</div>';
    return (
      '<div class="overlay" data-action="close-evidence-view">' +
      '<div class="modal wide" data-stop="1">' +
      '<div class="modal-head"><h3>' + escapeHtml(ev.name) + "</h3><button class=\"icon-btn\" data-action=\"close-evidence-view\">✕</button></div>" +
      preview +
      '<div class="modal-actions">' +
      (READONLY ? "" : '<button class="btn btn-danger" data-action="delete-evidence" data-card="' + cardId + '" data-evidence="' + ev.id + '">' + ICONS.trash + " Remover</button>") +
      '<button class="btn" data-action="download-evidence" data-card="' + cardId + '" data-evidence="' + ev.id + '">' + ICONS.download + " Baixar</button>" +
      '<button class="btn btn-primary" data-action="close-evidence-view">Voltar</button>' +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  // ---------- events ----------

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;

    if (action === "close-modal-backdrop") {
      if (e.target.dataset.action === "close-modal-backdrop") { ui.modal = null; render(); }
      return;
    }
    if (action === "close-modal") { ui.modal = null; render(); return; }
    if (action === "close-evidence-view") {
      ui.modal = ui.modal && ui.modal.cardId ? { type: "detail", cardId: ui.modal.cardId } : null;
      render();
      return;
    }
    if (action === "open-add") { ui.modal = { type: "add" }; render(); focusAddForm(); return; }
    if (action === "open-detail") {
      ui.modal = { type: "detail", cardId: el.dataset.card };
      render();
      return;
    }
    if (action === "edit-card") {
      if (READONLY) return;
      ui.modal = { type: "detail", cardId: el.dataset.card };
      pendingFocus = "d-text";
      render();
      return;
    }
    if (action === "go-cover") {
      ui.view = "cover";
      ui.confirmDeleteCard = null;
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "open-contract") {
      ui.view = "board";
      ui.filter = el.dataset.company;
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "open-all") {
      ui.view = "board";
      ui.filter = null;
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "view-evidence") {
      ui.modal = { type: "view-evidence", cardId: el.dataset.card, evId: el.dataset.evidence };
      render();
      return;
    }
    if (action === "select-status") {
      if (READONLY) return;
      moveCard(el.dataset.card, el.dataset.status);
      return;
    }
    if (action === "toggle-filter") {
      var comp = el.dataset.company;
      ui.filter = ui.filter === comp ? null : comp;
      render();
      return;
    }
    if (action === "filter-all") { ui.filter = null; render(); return; }
    if (action === "ask-delete-card") {
      if (READONLY) return;
      if (ui.modal && ui.modal.type === "detail") { deleteCard(el.dataset.card); return; }
      ui.confirmDeleteCard = el.dataset.card;
      render();
      return;
    }
    if (action === "cancel-delete-card") { ui.confirmDeleteCard = null; render(); return; }
    if (action === "confirm-delete-card") { deleteCard(el.dataset.card); return; }
    if (action === "delete-evidence") {
      if (READONLY) return;
      deleteEvidence(el.dataset.card, el.dataset.evidence);
      return;
    }
    if (action === "download-evidence") {
      downloadEvidence(el.dataset.card, el.dataset.evidence);
      return;
    }
    if (action === "download-html") {
      downloadBoardHtml();
      return;
    }
    if (action === "save-detail-text") {
      var card = el.dataset.card;
      var textEl = document.getElementById("d-text");
      var subEl = document.getElementById("d-sub");
      if (textEl) updateCardText(card, textEl.value, subEl ? subEl.value : "");
      return;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches && e.target.matches('[data-action="add-evidence"]')) {
      if (READONLY) return;
      var cardId = e.target.dataset.card;
      var files = e.target.files;
      if (files && files.length) addEvidenceFiles(cardId, files);
      e.target.value = "";
      return;
    }
    if (e.target.matches && e.target.matches('[data-action="detail-select-status"]')) {
      if (READONLY) return;
      moveCard(e.target.dataset.card, e.target.value);
      ui.modal = { type: "detail", cardId: e.target.dataset.card };
      render();
      return;
    }
  });

  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "add-form") {
      e.preventDefault();
      var company = document.getElementById("f-company").value;
      var text = document.getElementById("f-text").value;
      var sub = document.getElementById("f-sub").value;
      var status = document.getElementById("f-status").value;
      if (!text.trim()) return;
      addCard({ company: company, text: text, sub: sub, status: status });
      toast("Ação adicionada.");
    }
  });

  function focusAddForm() {
    setTimeout(function () {
      var el = document.getElementById("f-text");
      if (el) el.focus();
    }, 30);
  }

  // ---------- boot ----------

  (async function boot() {
    await initCapability();
    STATE = loadState();
    restoreUiAfterReload();
    try { sessionStorage.removeItem("kanban-reopen"); } catch (e) { /* ignore */ }
    render();
  })();
})();

</script>
</body>
</html>
